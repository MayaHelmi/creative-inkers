<style>
  .hero{display:grid;grid-template-columns:55fr 45fr;gap:var(--s6);align-items:center;padding-block:var(--s7)}
  .hero h1{font-size:clamp(44px,7.4vw,96px);margin-bottom:var(--s4)}
  .hero-actions{display:flex;align-items:center;gap:var(--s5);flex-wrap:wrap;margin-top:var(--s5)}
  .hero-art{position:relative;border:1px solid var(--rule);background:var(--panel)}
  .hero-art .plate{aspect-ratio:1/1;display:grid;place-items:center;padding:var(--s6)}
  .hero-art .plate img{width:100%;height:100%;object-fit:contain}
  .hero-caption{
    border-top:1px solid var(--rule);background:var(--panel);
    padding:var(--s3);display:flex;justify-content:space-between;gap:var(--s3);flex-wrap:wrap;
  }
  .specbar{background:var(--panel);border-top:1px solid var(--rule);border-bottom:1px solid var(--rule)}
  .specbar .wrap{display:grid;grid-template-columns:repeat(4,1fr)}
  .specbar .cell{padding:var(--s5) var(--s4);border-right:1px solid var(--rule)}
  .specbar .cell:last-child{border-right:0}
  .specbar .cell p{margin:10px 0 0;font-size:15px;color:var(--muted);line-height:1.45}
  .bundle-panels{display:grid;grid-template-columns:1fr 1fr;gap:var(--s4)}
  .mosaic{display:grid;grid-template-columns:repeat(3,1fr);gap:1px;background:var(--rule);border-bottom:1px solid var(--rule)}
  .mosaic .cellimg{aspect-ratio:1/1;padding:12%;display:grid;place-items:center}
  .mosaic .cellimg img{width:100%;height:100%;object-fit:contain}
  .printed-strip{display:grid;grid-template-columns:repeat(6,1fr);gap:var(--s3)}
  .printed-strip figure{margin:0}
  .printed-strip .shot{position:relative;aspect-ratio:4/5;border:1px solid var(--rule);background:var(--panel-2)}
  .printed-strip figcaption{margin-top:8px}
  .subjects{display:grid;grid-template-columns:repeat(4,1fr);gap:0 var(--s5)}
  .subjects a{
    display:flex;justify-content:space-between;gap:var(--s3);align-items:baseline;
    padding:12px 0;border-bottom:1px solid var(--rule);color:var(--ink);text-decoration:none;font-size:15px;
  }
  .subjects a:hover{color:var(--accent)}
  .signup{display:grid;grid-template-columns:1.1fr 1fr;gap:var(--s5);align-items:center}
  .signup form{display:flex;gap:var(--s3);flex-wrap:wrap}
  .signup .input{flex:1;min-width:220px}
  @media (max-width:980px){
    .hero{grid-template-columns:1fr;gap:var(--s5);padding-block:var(--s5)}
    .specbar .wrap{grid-template-columns:1fr 1fr}
    .specbar .cell:nth-child(2){border-right:0}
    .specbar .cell:nth-child(-n+2){border-bottom:1px solid var(--rule)}
    .bundle-panels,.signup{grid-template-columns:1fr}
    .printed-strip{grid-template-columns:repeat(3,1fr)}
    .subjects{grid-template-columns:1fr 1fr}
  }
  /* mobile compaction — must live here to win the cascade over the base rules above */
  @media (max-width:560px){
    .hero-art .plate{aspect-ratio:4/3;padding:var(--s4)}
    .specbar .cell{padding:var(--s4) var(--s3)}
    .printed-strip{display:flex;overflow-x:auto;gap:var(--s3);scroll-snap-type:x mandatory;padding-bottom:var(--s2)}
    .printed-strip figure{flex:0 0 44%;scroll-snap-align:start}
    .subjects a{padding:8px 0}
    .mosaic .cellimg:nth-child(n+4){display:none}
  }
</style>
