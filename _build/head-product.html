<style>
  .pd{display:grid;grid-template-columns:58fr 42fr;gap:var(--s5);align-items:start;padding-block:var(--s5)}
  .viewer-tabs{display:flex;gap:var(--s4);margin-bottom:var(--s3);overflow-x:auto}
  .viewer-tabs button{
    background:none;border:0;cursor:pointer;padding:8px 0;white-space:nowrap;
    font-family:var(--mono);font-size:11px;letter-spacing:.14em;text-transform:uppercase;
    color:var(--dim);border-bottom:2px solid transparent;min-height:40px;
  }
  .viewer-tabs button:hover{color:var(--ink)}
  .viewer-tabs button[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--accent)}
  .viewer{position:relative;aspect-ratio:1/1;border:1px solid var(--rule);background:var(--panel)}
  .viewer [data-pane]{position:absolute;inset:0}
  .pane-flat{display:grid;place-items:center;padding:var(--s6);cursor:zoom-in}
  .pane-flat.zoomed{display:block;overflow:auto;padding:0;cursor:zoom-out}
  .pane-flat.zoomed img{width:200%;max-width:none;height:auto}
  .pane-flat img{width:100%;height:100%;object-fit:contain}
  .viewer-strip{
    border:1px solid var(--rule);border-top:0;background:var(--bar);color:var(--bar-muted);
    padding:var(--s2) var(--s3);display:flex;justify-content:space-between;gap:var(--s3);
    font-family:var(--mono);font-size:10px;letter-spacing:.14em;text-transform:uppercase;
  }
  /* actual print size: CAD-style drawing */
  .pane-size{background:var(--panel);padding:var(--s4)}
  .pane-size svg{width:100%;height:100%}
  .decision{position:sticky;top:calc(72px + var(--s4));display:flex;flex-direction:column;gap:var(--s4)}
  .decision > .panel{padding:var(--s4)}
  .reassure{display:flex;gap:var(--s3);flex-wrap:wrap;justify-content:space-between}
  .filetree{font-family:var(--mono);font-size:12.5px;line-height:2;color:var(--ink);overflow-x:auto;white-space:pre}
  .filetree .dim{color:var(--dim)}
  .steps-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:var(--s3)}
  .step-card{border:1px solid var(--rule);padding:var(--s3);background:var(--panel-3)}
  .step-card .mono{color:var(--accent)}
  .step-card h4{margin:8px 0 8px}
  .step-card p{font-size:13.5px;color:var(--muted);line-height:1.5;margin:0}
  @media (max-width:980px){
    .pd{grid-template-columns:1fr}
    .decision{position:static}
    .steps-grid{grid-template-columns:1fr 1fr}
    .buybar{display:flex}
    body{padding-bottom:calc(104px + var(--safe-b))}
  }
  @media (max-width:560px){.steps-grid{grid-template-columns:1fr}}
</style>
