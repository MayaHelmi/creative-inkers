<style>
  .vaults{display:grid;grid-template-columns:1fr 1fr;gap:var(--s4)}
  .mosaic{display:grid;grid-template-columns:repeat(4,1fr);gap:1px;background:var(--rule);border-bottom:1px solid var(--rule)}
  .mosaic .cellimg{aspect-ratio:1/1;padding:14%;display:grid;place-items:center}
  .mosaic .cellimg img{width:100%;height:100%;object-fit:contain}
  .allaccess{display:grid;grid-template-columns:2fr 1fr;gap:var(--s5);padding:var(--s5);position:relative}
  .allaccess .reg{position:absolute;top:var(--s3);left:var(--s3)}
  .aa-list{list-style:none;margin:var(--s4) 0 0;padding:0;display:flex;flex-direction:column;gap:12px}
  .aa-list li{display:grid;grid-template-columns:12px 1fr;gap:12px;align-items:baseline;font-size:16px}
  .aa-list li::before{content:"";width:8px;height:8px;background:var(--accent);margin-top:4px}
  .aa-price{display:flex;flex-direction:column;gap:var(--s3);justify-content:center;border-left:1px solid var(--rule);padding-left:var(--s5)}
  .builder{display:grid;grid-template-columns:repeat(4,1fr);gap:var(--s3)}
  .build-item{border:1px solid var(--rule);background:var(--panel);padding:var(--s3);display:flex;flex-direction:column;gap:8px}
  .build-item .thumb{aspect-ratio:1/1;padding:14%}
  .build-item img{width:100%;height:100%;object-fit:contain}
  @media (max-width:980px){
    .vaults{grid-template-columns:1fr}
    .allaccess{grid-template-columns:1fr}
    .aa-price{border-left:0;border-top:1px solid var(--rule);padding-left:0;padding-top:var(--s4)}
    .builder{grid-template-columns:1fr 1fr}
  }
</style>
